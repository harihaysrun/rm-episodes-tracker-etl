name: Get episodes every Monday
on:
  push:
    branches:
      - main
    paths:
      - 'data-pipeline/**'
    schedule:
      - cron: '0 23 * * 1' # run once everyweek at 12pm sgt
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt
          
      - name: Run ETL scripts
        env:
          DB_URL : ${{ secrets.DB_URL }}
        run: |
          python data-pipeline/scraper.py
          python data-pipeline/transform.py
          python data-pipeline/load.py